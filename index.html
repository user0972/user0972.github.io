<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REVIVAL</title>
  <script>
    (function () {
      const session = sessionStorage.getItem('revival_session');
      if (!session) {
        location.replace('/signup/');
        return;
      }
      document.documentElement.style.visibility = 'visible';
    })();
  </script>
  <style>html{visibility:hidden}body{font:14px Arial,sans-serif;margin:0;background:#f2f2f2;color:#333}.bar{height:40px;background:#b00;color:white;display:flex;align-items:center;padding:0 18px;font-weight:bold}.content{max-width:960px;margin:35px auto;background:white;border:1px solid #ccc;padding:22px}a{color:#06c}</style>
</head>
<body>
  <div class="bar">REVIVAL</div>
  <main class="content">
    <h2>You're signed in.</h2>
    <p>Your account session was found. The logged-in homepage hasn't been built yet.</p>
    <p><a href="/signup/" onclick="sessionStorage.removeItem('revival_session');sessionStorage.removeItem('revival_player');">Sign out</a></p>
  </main>
</body>
</html>
